<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="icon" href="./assest/icon.png" />
    <title>Login</title>
  </head>
  <body>
    <div class="bg-glow bg-glow--one"></div>
    <div class="bg-glow bg-glow--two"></div>

    <form id="loginForm">
      <div class="brand-mark">
        <span class="brand-mark__dot"></span>
        Zone01
      </div>

      <p id="errorMsg" class="error"></p>
      <p2>Sign in to continue</p2><br />
      <input
        type="text"
        id="identifier"
        placeholder="Username or Email"
        required
      />
      <input type="password" id="password" placeholder="Password" required />
      <p2>
        Hi, this platform is private if you know that you don't have access,
        don't try to login, or these actions will have consequances!</p2
      >
      <button type="submit">Login</button>
    </form>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
